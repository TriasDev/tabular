version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned on purpose in the comparison benchmark: the committed versions are chosen for their
      # licence terms, and a bump would change that silently. Decide by hand.
      - dependency-name: "EPPlus"
      - dependency-name: "NPOI"
      # xunit v4 requires Microsoft.Testing.Platform — a migration, tracked in #27.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
