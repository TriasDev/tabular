version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned on purpose in the comparison benchmark: the committed versions are chosen for their
      # licence terms, and a bump would change that silently. Decide by hand.
      - dependency-name: "EPPlus"
      - dependency-name: "NPOI"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "documentation"]
    commit-message:
      prefix: "chore"
