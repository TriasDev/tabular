name: Feature request
description: Something the library should do that it does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation, not the solution — what file, what import, what is in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: An API you would like, if you have one in mind. docs/IDEAS.md may already sketch it.
