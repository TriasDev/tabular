name: CI

on:
  push:
    branches: [ main, 'release-please--**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The library and its tests target net8.0 and net10.0, so one job per operating system runs both:
  # the SDK from global.json, plus the net8 runtime.
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TriasDev.Tabular.slnx

      - name: Build
        run: dotnet build TriasDev.Tabular.slnx --no-restore --configuration Release

      - name: Test (net8.0 and net10.0)
        run: >-
          dotnet test --solution TriasDev.Tabular.slnx --no-build --configuration Release
          --coverlet --coverlet-output-format cobertura --results-directory ./test-results

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: './test-results/coverage.cobertura.*.xml'
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TriasDev.Tabular.slnx

      - name: Check formatting
        run: dotnet format TriasDev.Tabular.slnx --verify-no-changes --no-restore

  # The suite under non-English cultures and non-UTC time zones: the library must never read the
  # current culture or clock ("99,99" against "99.99", the Turkish dotless i, local midnight).
  culture-tests:
    name: Culture Tests (${{ matrix.culture }}, ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - culture: de-DE
            locale: de_DE.UTF-8
            tz: Europe/Berlin
          - culture: tr-TR
            locale: tr_TR.UTF-8
            tz: Europe/Istanbul
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
      TZ: ${{ matrix.tz }}
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Verify culture and time zone apply to .NET
        working-directory: ${{ runner.temp }}
        run: |
          cat > culture-check.cs <<'CHECK'
          using System.Globalization;

          string expected = args[0];
          Console.WriteLine($"CurrentCulture={CultureInfo.CurrentCulture.Name} TimeZone={TimeZoneInfo.Local.Id} Sample={99.99m}");
          if (CultureInfo.CurrentCulture.Name != expected)
          {
              Console.Error.WriteLine($"Expected culture {expected} but got '{CultureInfo.CurrentCulture.Name}'");
              return 1;
          }
          return 0;
          CHECK
          dotnet run culture-check.cs -- "${{ matrix.culture }}"

      - name: Restore
        run: dotnet restore TriasDev.Tabular.slnx

      - name: Build
        run: dotnet build TriasDev.Tabular.slnx --no-restore --configuration Release

      # The main suite only: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT above overrides the
      # InvariantGlobalization setting of the invariant-globalization test host, which runs in the
      # build-and-test job instead.
      - name: Test
        run: dotnet test --project tests/TriasDev.Tabular.Tests --no-build --configuration Release

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/TriasDev.Tabular/TriasDev.Tabular.csproj --configuration Release --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 7

  # Single aggregate status for branch protection: require only "CI Success", so matrix changes do
  # not require updating the protection rules.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, lint, culture-tests, pack]
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one required job did not succeed ($r)"
              exit 1
            fi
          done
