site_name: TriasDev.Tabular
site_description: Fast, low-memory reading and writing of csv, Excel and OpenDocument files for .NET — profile every column, map, validate and import; export styled files as a stream — with no dependencies
site_author: TriasDev
site_url: https://triasdev.github.io/tabular/
repo_url: https://github.com/TriasDev/tabular
repo_name: TriasDev/tabular
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  logo: assets/images/icon.svg
  favicon: assets/images/icon-64.png
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Code on the site is taken from the samples the build compiles, so it cannot drift from the API.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list

plugins:
  - search:
      lang: en
  # llms.txt for AI agents: a short map of the library, every page as Markdown, and all of it in one
  # file (https://llmstxt.org).
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        TriasDev.Tabular is a .NET 8/10 library (NuGet: TriasDev.Tabular, no dependencies) that reads
        csv, xlsx, ods (alone or in zip, tar or gzip archives), profiles every column over every row,
        and imports rows through a column mapping a person confirmed; and that writes csv, xlsx, ods
        and a zip of csv sheets, streaming and asynchronously, with cell styles and sheet layout.

        Importing is two independent reads of the same file, with no state kept between them:

        1. `TabularFile.Open(stream, name)` returns an `ITabularCursor`; `TabularAnalyzer.Analyze(cursor)`
           returns a `FileProfile` (per sheet `SheetProfile`, per column measured `ColumnFacts` and ranked
           `TypeHypothesis` suggestions).
        2. Declare fields with `ImportField.Text/Integer/Decimal/Date/Boolean(...)` and rules
           (`Require()`, `MaxLength()`, ...); put them in an `ImportSchema`; build a `MappingPlan`
           (`MappingPlan.ByHeader(sheetProfile, schema)` or by hand); optionally judge it with
           `MappingPrecheck.Check(plan, schema, profile)`.
        3. `TabularImporter.Import(stream, name, plan, schema, row => new MyType(row[field], ...))`
           returns an `ImportRun<T>`: read it once: `ReadRows(ct)` for outcomes (a value or `RowError`s), `ReadChunks(size, ct)` or `ReadAll(limit, ct)`.

        Exporting writes into any writable stream (it need not seek; an ASP.NET Core response body works):

        1. Row by row: `await using TabularWriter writer = TabularWriter.Create(stream, TabularFormat.Xlsx)`
           (or `Csv`, `Ods`, `Zip` for a zip of csv sheets); `BeginSheet(name, columns, sheetOptions)`;
           per row `BeginRow()`, one `Write(value[, styleId])` per column, `EndRow()`; `await FlushAsync(ct)`
           whenever `FlushRecommended`; `await CompleteAsync(ct)` at the end. The file is valid only
           after `CompleteAsync`; a writer that failed leaves an incomplete file, which the caller discards.
        2. Objects: `TabularExport.For<T>().Column("Header", x => x.Value, width, style).Sheet(options).Build()`,
           kept in a static field, then `WriteAsync(stream, format, sheetName, items or chunks, ct)` or
           `WriteSheetAsync(writer, sheetName, ...)` for several sheets.
        3. By column: `ColumnBatch` (`Reset(rowCount)`, `Add(list[, style])`) and `writer.WriteBatchAsync(batch, ct)`.
        4. Styles: `CellStyle` (fill, font, `NumberFormat.Parse`, `DateFormat.Parse`, alignment, wrap,
           border), registered per writer with `writer.RegisterStyle(style)` → `StyleId`; xlsx and ods only, csv
           ignores them. `SheetOptions`: `HeaderStyle`, `FreezeRows`, `FreezeColumns`, `AutoFilter`;
           `writer.Merge(rows, columns)` merges from the next cell.
        A value the format cannot hold exactly throws `TabularWriteException` (codes `write.*`, with
        `SheetName`, `RowNumber`, `ColumnIndex`, `Header`); it is never rounded.

        Every problem the library reports while reading — a `RowError` from a row, a `MappingFault` from a plan, a
        `PrecheckFinding` predicted from a profile — implements `ITabularProblem` (`Code`, `FieldName`,
        `ColumnIndex`); a finding also carries `Examples` and named `Arguments` instead of a sentence.

        Rules that are easy to get wrong: a row (`CurrentRow`, `ImportRow`) is a view over a reused
        buffer — copy what you keep before the next read. Row errors carry codes such as
        `value.required`, not messages. Library exceptions derive from `TabularException` and carry a
        code (`TabularFormatException`, `TabularLimitException`, `TabularStructureException`,
        `MappingPlanException`, and on the write side `TabularWriteException`). Every structure read from a file is bounded, by an option or by the format's own fixed ceiling. Streams are
        closed by the library unless `LeaveOpen` is set. The format is decided by the file's bytes,
        never its name.
      sections:
        Start:
          - index.md: What the library does — reading and writing — and where to read on
          - getting-started.md: Install, read a file, profile, map, check and import; write a file
          - concepts.md: The two reads, what a profile measures, facts against suggestions; how writing works
        Using it:
          - importing.md: Import runs, batches, rules, translated fields, the precheck
          - exporting.md: Writing csv, xlsx, ods and zip files; styles, layout, streams, failures
          - formats.md: What csv, xlsx, ods, zip, tar and gzip files read as; csv repair; what each format holds when written
          - operations.md: Stream ownership, cancellation, progress, cultures
        Reference:
          - error-codes.md: Every error code
          - bounds.md: Every ceiling and its option; the limits a written file is held to
          - performance.md: The library's own speed and memory numbers
          - benchmarks.md: Comparison with other csv and xlsx libraries, reading and writing
          - KNOWN-ISSUES.md: Known limitations and when they matter

# Internal material that lives in docs/ but is not published: plans and specs, the old single-page
# guide (kept on GitHub as a pointer for links from the first release), and test notes.
exclude_docs: |
  superpowers/
  guide.md
  TEST-GAPS.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TriasDev/tabular

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: concepts.md
  - Using it:
    - Importing: importing.md
    - Exporting: exporting.md
    - Formats: formats.md
    - Streams, cancellation, progress, cultures: operations.md
  - Reference:
    - Error codes: error-codes.md
    - Bounds: bounds.md
    - Performance: performance.md
    - Benchmarks: benchmarks.md
    - Known issues: KNOWN-ISSUES.md
    - Ideas: IDEAS.md
    - Why the parsing is our own: adr/0001-tabular-parsing-is-our-own-cursor.md
    - Why the writing is our own: adr/0002-writing-is-our-own.md
